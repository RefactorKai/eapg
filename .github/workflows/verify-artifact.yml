name: Verify research artifact

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -B -S eapg.py status
      - run: python -B eapg.py verify --mode common --verbose
      - name: Verify AST, selector, and unit suites
        run: |
          python -m pip install -r requirements-ast.txt pytest
          python -B eapg.py verify --mode linux --verbose --allow-skips
          python -B -m pytest -q
      - name: Run Gate 1 Bubblewrap probes when userns and user systemd are available
        if: runner.os == 'Linux'
        run: |
          if command -v bwrap >/dev/null && command -v systemd-run >/dev/null && systemctl --user show-environment >/dev/null 2>&1 && bwrap --unshare-user --ro-bind / / true >/dev/null 2>&1; then
            python -B development/probe_gate1.py --probes-only
          else
            echo "Skipping Gate 1 Bubblewrap probes: hosted runner lacks user systemd or unprivileged userns"
          fi
