name: Verify research artifact

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -B -S eapg.py status
      - run: python -B eapg.py verify --mode common --verbose
      - name: Verify AST, selector, and unit suites
        run: |
          python -m pip install -r requirements-ast.txt pytest
          python -B eapg.py verify --mode linux --verbose --allow-skips
          python -B -m pytest -q

  gate1:
    # The container runs privileged. Only exercise same-repository code on a disposable hosted VM.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run Gate 1 probes and sandbox tests in the pinned image
        run: |
          bash development/run_sandbox_container.sh bash -es <<'CI'
          g++ -dumpfullversion
          bwrap --version
          systemd --version
          python --version
          kpsewhich IEEEtran.cls
          python -B development/check_gate1_ci.py
          # WP-A1: add the public re-execution verify command here when it lands.
          CI
